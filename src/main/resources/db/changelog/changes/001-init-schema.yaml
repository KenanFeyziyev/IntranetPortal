databaseChangeLog:
  - changeSet:
      id: 001-init-schema
      author: kenan
      changes:

        - createTable:
            tableName: departments
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: department_name
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
                    unique: true

        - createTable:
            tableName: positions
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: name
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
                    unique: true

        - createTable:
            tableName: employees
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false

              - column:
                  name: first_name
                  type: VARCHAR(255)
                  constraints:
                    nullable: false

              - column:
                  name: last_name
                  type: VARCHAR(255)
                  constraints:
                    nullable: false

              - column:
                  name: patronymic
                  type: VARCHAR(255)

              - column:
                  name: birth_date
                  type: DATE

              - column:
                  name: email
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
                    unique: true

              - column:
                  name: phone_number
                  type: VARCHAR(255)

              - column:
                  name: address
                  type: VARCHAR(255)

              - column:
                  name: password
                  type: VARCHAR(255)
                  constraints:
                    nullable: false

              - column:
                  name: department_id
                  type: BIGINT

              - column:
                  name: position_id
                  type: BIGINT

              - column:
                  name: is_active
                  type: BOOLEAN
                  defaultValueBoolean: true

        - createTable:
            tableName: attendances
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false

              - column:
                  name: action_date
                  type: TIMESTAMP
                  constraints:
                    nullable: false

              - column:
                  name: employee_id
                  type: BIGINT
                  constraints:
                    nullable: false

        - createTable:
            tableName: work_permits
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false

              - column:
                  name: reason
                  type: VARCHAR(255)
                  constraints:
                    nullable: false

              - column:
                  name: start_date
                  type: TIMESTAMP

              - column:
                  name: end_date
                  type: TIMESTAMP

              - column:
                  name: is_approved
                  type: BOOLEAN
                  defaultValueBoolean: false
                  constraints:
                    nullable: false

              - column:
                  name: approved_date
                  type: TIMESTAMP

              - column:
                  name: approved_by
                  type: VARCHAR(255)

              - column:
                  name: is_deleted
                  type: BOOLEAN
                  defaultValueBoolean: false
                  constraints:
                    nullable: false

              - column:
                  name: permit_date
                  type: TIMESTAMP

              - column:
                  name: permit_duration_in_minutes
                  type: INT

              - column:
                  name: employee_id
                  type: BIGINT
                  constraints:
                    nullable: false

        # Foreign Keys
        - addForeignKeyConstraint:
            baseTableName: employees
            baseColumnNames: department_id
            referencedTableName: departments
            referencedColumnNames: id
            constraintName: fk_employees_department

        - addForeignKeyConstraint:
            baseTableName: employees
            baseColumnNames: position_id
            referencedTableName: positions
            referencedColumnNames: id
            constraintName: fk_employees_position

        - addForeignKeyConstraint:
            baseTableName: attendances
            baseColumnNames: employee_id
            referencedTableName: employees
            referencedColumnNames: id
            constraintName: fk_attendances_employee

        - addForeignKeyConstraint:
            baseTableName: work_permits
            baseColumnNames: employee_id
            referencedTableName: employees
            referencedColumnNames: id
            constraintName: fk_work_permits_employee

        # Indexes (performans üçün)
        - createIndex:
            tableName: employees
            indexName: idx_employees_email
            columns:
              - column:
                  name: email

        - createIndex:
            tableName: employees
            indexName: idx_employees_department_id
            columns:
              - column:
                  name: department_id

        - createIndex:
            tableName: employees
            indexName: idx_employees_position_id
            columns:
              - column:
                  name: position_id

        - createIndex:
            tableName: attendances
            indexName: idx_attendances_employee_id
            columns:
              - column:
                  name: employee_id

        - createIndex:
            tableName: work_permits
            indexName: idx_work_permits_employee_id
            columns:
              - column:
                  name: employee_id