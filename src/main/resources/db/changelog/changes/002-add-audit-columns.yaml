databaseChangeLog:
  - changeSet:
      id: 002-add-audit-columns
      author: kenan
      changes:

        - addColumn:
            tableName: departments
            columns:
              - column:
                  name: created_date
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: updated_date
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false

